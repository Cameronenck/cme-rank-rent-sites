<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2d3748;--accent:#e53e3e;--accent-hover:#c53030}
body{font-family:'Inter',system-ui,sans-serif;background:#f8f9fa;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:12px;padding:48px 40px;max-width:540px;width:100%;text-align:center;box-shadow:0 4px 32px rgba(0,0,0,.10);border-top:4px solid var(--accent)}
.icon{width:64px;height:64px;background:#e8f5e9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.icon svg{width:32px;height:32px;fill:#2e7d32}
h1{font-weight:800;font-size:clamp(24px,5vw,34px);color:var(--primary);margin-bottom:16px;line-height:1.15}
p{font-size:16px;color:#4a5568;line-height:1.7;margin-bottom:24px}
.call-btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:16px 32px;border-radius:6px;text-decoration:none;font-size:18px;font-weight:700;margin-bottom:16px;transition:background .2s}
.call-btn:hover{background:var(--accent-hover)}
.call-btn svg{width:20px;height:20px;fill:#fff}
.home-link{display:block;font-size:14px;color:var(--primary);text-decoration:none;font-weight:600}
.home-link:hover{text-decoration:underline}
@media(max-width:480px){.card{padding:32px 20px}}

/* === SERVICE PAGE SUPPLEMENTAL STYLES === */
/* Bridges old service page class names to the new design system */

/* Section labels / titles / subs */
.section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .2em; color: var(--accent); margin-bottom: 10px; display: block; }
.section-title { font-family: var(--font-heading); font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 800; color: var(--ink); margin-bottom: 14px; line-height: 1.15; }
.section-sub { font-size: 1.05rem; color: var(--muted); max-width: 600px; line-height: 1.65; margin-bottom: 40px; }

/* Page Hero */
.page-hero { background: linear-gradient(135deg, var(--primary-950), var(--primary-700)); padding: 80px 24px 60px; }
.page-hero-inner { max-width: 900px; margin: 0 auto; }
.page-hero h1 { font-family: var(--font-heading); font-size: clamp(1.9rem, 4.5vw, 3.2rem); font-weight: 800; color: #fff; line-height: 1.1; margin-bottom: 16px; }
.page-hero p { font-size: 17px; color: rgba(255,255,255,.8); max-width: 640px; line-height: 1.7; margin-bottom: 32px; }
.pg-btns { display: flex; flex-wrap: wrap; gap: 14px; }
.pg-btn-main { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: var(--ink); padding: 14px 32px; border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 16px; font-weight: 700; transition: all var(--transition-base); }
.pg-btn-main:hover { background: var(--accent-hover); transform: translateY(-1px); }
.pg-btn-ghost { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); color: #fff; padding: 14px 28px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; border: 1px solid rgba(255,255,255,.25); transition: background var(--transition-base); }
.pg-btn-ghost:hover { background: rgba(255,255,255,.18); }

/* Content Sections */
.content-section { padding: 72px 24px; background: var(--paper); }
.content-section.alt { background: var(--cream); }
.content-wrap { max-width: 900px; margin: 0 auto; }
.content-inner { max-width: 900px; margin: 0 auto; }
.content-section h2 { font-family: var(--font-heading); font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 800; color: var(--ink); margin: 40px 0 14px; }
.content-section h2:first-child { margin-top: 0; }
.content-section p { font-size: 16px; color: var(--body-color); line-height: 1.8; margin-bottom: 16px; }
.content-section ul { list-style: none; margin: 0 0 20px; padding: 0; }
.content-section ul li { padding: 8px 0 8px 26px; position: relative; font-size: 16px; color: var(--body-color); line-height: 1.7; }
.content-section ul li::before { content: ''; position: absolute; left: 0; top: 17px; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
.body-text { font-size: 16px; color: var(--body-color); line-height: 1.8; }
.checklist { list-style: none; padding: 0; margin: 0 0 20px; }
.checklist li { padding: 8px 0 8px 30px; position: relative; font-size: 15.5px; color: var(--body-color); line-height: 1.7; }
.checklist li::before { content: '✓'; position: absolute; left: 0; top: 8px; color: var(--accent); font-weight: 700; }

/* Hero CTA row */
.hero-ctas { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
.header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-bottom: 40px; }

/* Pricing */
.price-card { background: var(--cream); border-radius: var(--radius); padding: 22px; text-align: center; border: 1.5px solid var(--line); }
.price-label { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
.price-range { font-family: var(--font-heading); font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; color: var(--primary); }
.price-note { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Compare section */
.compare-section { padding: 72px 24px; background: var(--cream); }
.compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-top: 28px; }
.compare-card { background: var(--paper); border-radius: var(--radius); padding: 28px; border: 1.5px solid var(--line); }
.compare-card h3 { font-family: var(--font-heading); font-size: 1.2rem; font-weight: 700; color: var(--ink); margin-bottom: 12px; }

/* When table (comparison table) */
.when-table { width: 100%; border-collapse: collapse; margin: 1.4em 0; }
.when-row { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
.when-cell { flex: 1; padding: 14px 16px; font-size: 14.5px; color: var(--body-color); }
.when-cell:first-child { font-weight: 600; color: var(--ink); background: var(--cream); }

/* Two-column layout */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
@media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

/* Tags */
.tag { display: inline-block; background: var(--cream); border: 1px solid var(--line); color: var(--primary); font-size: 13px; font-weight: 500; padding: 5px 14px; border-radius: 20px; }
.tag-soft { background: var(--gold-pale); border-color: var(--gold); color: var(--accent-dark); }
.tag-pressure { background: var(--primary); color: #fff; }

/* Highlight / callout box */
.highlight { background: var(--gold-pale); border-left: 4px solid var(--gold); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 18px 22px; margin: 24px 0; }
.highlight-box { background: var(--cream); border-radius: var(--radius); padding: 28px; margin: 28px 0; border: 1.5px solid var(--line); }

/* FAQ — service page style (uses details/summary + chevron SVG) */
.faq-wrap { max-width: 800px; margin: 0 auto; }
.faq-item { background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.faq-question { width: 100%; background: none; border: none; text-align: left; padding: 18px 22px; font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.faq-question::after { content: '+'; font-size: 1.4rem; color: var(--accent); flex-shrink: 0; transition: transform var(--transition-base); }
.faq-item.open .faq-question::after { content: '−'; }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.faq-item.open .faq-answer { max-height: 300px; }
.faq-answer p { padding: 0 22px 18px; color: var(--muted); font-size: 15px; line-height: 1.75; }
.faq-chevron { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
details[open] .faq-chevron { transform: rotate(180deg); }

/* CTA Banner */
.cta-banner { background: linear-gradient(135deg, var(--primary-950), var(--primary-700)); color: #fff; text-align: center; padding: 72px 24px; }
.cta-banner h2 { font-family: var(--font-heading); font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 16px; color: #fff; }
.cta-banner p { font-size: 1.1rem; color: rgba(255,255,255,.8); margin-bottom: 36px; }
.cta-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.cta-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.btn-white { background: #fff; color: var(--primary); padding: 14px 32px; border-radius: var(--radius-sm); font-family: var(--font-body); font-weight: 700; font-size: 16px; transition: all var(--transition-base); display: inline-block; }
.btn-white:hover { background: var(--accent); color: var(--ink); }
.btn-yellow { background: var(--accent); color: var(--ink); padding: 14px 32px; border-radius: var(--radius-sm); font-family: var(--font-body); font-weight: 700; font-size: 16px; transition: all var(--transition-base); display: inline-block; }
.btn-yellow:hover { background: var(--accent-hover); }
.btn-outline { background: transparent; color: #fff; border: 2px solid #fff; padding: 14px 28px; border-radius: var(--radius-sm); font-family: var(--font-body); font-weight: 700; font-size: 16px; transition: all var(--transition-base); display: inline-block; }
.btn-outline:hover { background: rgba(255,255,255,.1); }
.btn-secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 12px 28px; border-radius: var(--radius-sm); font-family: var(--font-body); font-weight: 600; font-size: 15px; transition: all var(--transition-base); display: inline-block; }
.btn-secondary:hover { background: var(--primary); color: #fff; }
.btn-lg { padding: 16px 40px; font-size: 18px; }

/* Internal links section */
.internal-links { background: var(--paper); padding: 40px 24px; border-top: 1px solid var(--line); }
.internal-links-wrap { max-width: 900px; margin: 0 auto; }
.internal-links h3 { font-family: var(--font-heading); font-size: 1.15rem; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
.related-links { background: var(--cream); padding: 40px 24px; }
.related-links-inner { max-width: 900px; margin: 0 auto; }
.links-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 16px; }
.link-card { background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px 20px; color: var(--primary); font-weight: 500; font-size: 14.5px; transition: all var(--transition-base); display: block; }
.link-card:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Mobile call bar */
.mobile-call-bar { display: none; }
@media (max-width: 640px) {
  .mobile-call-bar { display: block; background: var(--accent); color: var(--ink); text-align: center; padding: 12px 16px; font-size: 16px; font-weight: 700; }
  .sticky-call { display: block; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; background: var(--accent); padding: 14px; text-align: center; }
  .sticky-call a { color: var(--ink); font-weight: 800; font-size: 17px; font-family: var(--font-body); }
  .compare-grid { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr; }
  .pg-btns { flex-direction: column; }
  .cta-btns { flex-direction: column; align-items: center; }
}
</style>
